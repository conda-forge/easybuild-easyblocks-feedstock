{% set version = "5.1.2" %}

package:
  name: easybuild-easyblocks
  version: {{ version }}

source:
  fn: easybuild-easyblocks-{{ version }}.tar.gz
  url: https://pypi.org/packages/source/e/easybuild-easyblocks/easybuild_easyblocks-{{ version }}.tar.gz
  sha256: 68e8e39371dd4bec32bbc3aa55a053a70c0fc8b931dba0dfec25c68770b24c37

build:
  number: 0
  skip: true  # [win or py3k]
  script: python setup.py install --single-version-externally-managed --record record.txt

requirements:
  host:
    - python
    - setuptools
  run:
    - python
    - easybuild-framework >=3

test:
  imports:
    - easybuild
    - easybuild.easyblocks
    - easybuild.easyblocks.generic

about:
  home: https://easybuild.io/
  license: GPL-2.0-only
  license_file: LICENSE
  summary: Python modules which implement support for installing particular (groups of) software packages with EasyBuild.

extra:
  recipe-maintainers:
    - jerowe
    - boegel
